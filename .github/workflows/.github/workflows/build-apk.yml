name: Build FriendCampus APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          d=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          echo "Project folder: $d"
          echo "APP_DIR=$d" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: ${{ env.APP_DIR }}
      - run: npx cap add android
        working-directory: ${{ env.APP_DIR }}
      - run: npx cap sync android
        working-directory: ${{ env.APP_DIR }}
      - name: Red status bar
        working-directory: ${{ env.APP_DIR }}
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item><item name="android:statusBarColor">\#F44336</item><item name="android:windowLightStatusBar">false</item>#' $f
      - run: ./gradlew assembleDebug
        working-directory: ${{ env.APP_DIR }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: FriendCampus-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
